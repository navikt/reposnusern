name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  # PRs: group by branch → new push cancels old run
  # Main: unique per commit → every merge gets tested
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.head_ref) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-lint:
    name: 🔎 Unit & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Sjekk ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🧰 Sett opp Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 🧪 Unit-tester + vet + lint
        run: make generate-mocks tidy vet lint unit

      - name: 🔨 Bygg
        run: make build

  integration-postgres:
    name: 🐘 PostgreSQL integrasjonstest
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 🔧 Generer mocks
        run: make generate-mocks

      - name: 🚀 Kjør Postgres-integrasjonstest
        run: go test -v ./test/integration_postgres

  deploy:
    name: Build and deploy to production
    needs: integration-postgres
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false # Let in-flight deploys finish
    permissions:
      contents: read
      id-token: write # Needed for workload identity federation (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod-gcp:appsec

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795 # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: appsec
          push_image: true

      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          RESOURCE: .nais/nais.yml
          CLUSTER: prod-gcp
          IMAGE: ${{ steps.docker-push.outputs.image }}
